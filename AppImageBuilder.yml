version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.fastrizwaan.PopcornBox
    name: PopcornBox
    icon: io.github.fastrizwaan.PopcornBox
    version: '{{APP_VERSION}}'
    exec: usr/bin/python3
    exec_args: $APPDIR/usr/bin/cine $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - ca-certificates
      - ffmpeg
      - gir1.2-adw-1
      - gir1.2-gtk-4.0
      - libadwaita-1-0
      - libmpv2
      - python3
      - python3-cairo
      - python3-gi
      - python3-libtorrent
      - python3-mpv
      - yt-dlp

  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'
      GI_TYPELIB_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0'
      GSETTINGS_SCHEMA_DIR: '${APPDIR}/usr/share/glib-2.0/schemas'
      SSL_CERT_FILE: '${APPDIR}/etc/ssl/certs/ca-certificates.crt'
    path_mappings:
      - '/usr/share/popcorn-box:$APPDIR/usr/share/popcorn-box'

AppImage:
  arch: x86_64
  file_name: 'PopcornBox-{{APP_VERSION}}-x86_64.AppImage'
